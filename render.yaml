services:
  - type: web
    name: neos-operations-portal
    runtime: python
    plan: free
    rootDir: neos_portal
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_default_admin"
    startCommand: "gunicorn neos_portal.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Everything marked sync:false is typed into the Render dashboard
      # (Environment tab) -- never put real values in this public file.
      # DATABASE_URL = the Internal Database URL of the existing neos-portal-db.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
