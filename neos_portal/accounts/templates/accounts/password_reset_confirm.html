{% extends "core/base_unauthenticated.html" %}
{% block content %}
<div class="auth-card">
  <h1>Choose a new password</h1>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.new_password1 }}
    {{ form.new_password2 }}
    <button type="submit" class="btn btn-primary btn-block">Set new password</button>
  </form>
  {% else %}
  <p class="auth-sub">This reset link is invalid or has expired.</p>
  {% endif %}
</div>
{% endblock %}
