{% extends "core/base_unauthenticated.html" %}
{% block content %}
<div class="auth-card">
  <h1>Reset your password</h1>
  <p class="auth-sub">Enter the email on your account and we'll send reset instructions.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email }}
    <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
  </form>
</div>
{% endblock %}
