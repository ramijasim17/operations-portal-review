{% extends "core/base.html" %}
{% block content %}
<h1>{% if action %}Edit action{% else %}New action{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn" href="{% url 'action_tracker:list' %}">Cancel</a>
</form>
{% endblock %}
