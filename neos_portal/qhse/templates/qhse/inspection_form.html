{% extends "core/base.html" %}
{% block content %}
<h1>{% if item %}Edit {{ item.reference }}{% else %}Schedule an inspection{% endif %}</h1>
  <datalist id="asset-serial-list">{% for s in asset_serials %}<option value="{{ s }}">{% endfor %}</datalist>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn" href="{% url 'qhse:inspection_list' %}">Cancel</a>
</form>
{% endblock %}
