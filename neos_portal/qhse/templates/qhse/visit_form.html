{% extends "core/base.html" %}
{% block content %}
<h1>{% if visit %}Edit {{ visit.reference }}{% else %}New site visit report{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">{% if visit %}Save{% else %}Start the report{% endif %}</button>
  <a class="btn" href="{% url 'qhse:visit_list' %}">Cancel</a>
</form>
{% endblock %}
