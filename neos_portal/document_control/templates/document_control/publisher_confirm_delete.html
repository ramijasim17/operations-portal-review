{% extends "core/base.html" %}
{% block content %}
<h1>Delete publisher "{{ org.name }}"?</h1>
<p class="page-sub">This can't be undone. If any documents still use this publisher, the delete will be blocked instead of leaving them without one.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-primary" type="submit">Yes, delete it</button>
  <a data-modal class="btn" href="{% url 'document_control:publisher_manage' %}">Cancel</a>
</form>
{% endblock %}
