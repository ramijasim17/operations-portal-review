{% extends "core/base.html" %}
{% block content %}
<p class="page-sub"><a data-modal href="{% url 'document_control:publisher_manage' %}">Publishers</a> / Edit {{ org.name }}</p>
<h1>Edit publisher</h1>
<form method="post" style="max-width:420px;">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a data-modal class="btn" href="{% url 'document_control:publisher_manage' %}">Cancel</a>
</form>
{% endblock %}
