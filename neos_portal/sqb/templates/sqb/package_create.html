{% extends "core/base.html" %}
{% block content %}
<p class="page-sub crumbs"><a href="{% url 'sqb:job_list' %}">SQB</a> / Create SQB</p>
<h1>Create SQB — {{ job_report.name }}</h1>
<p class="page-sub">Manifest {{ job_report.manifest.job_number }} · {{ job_report.manifest.client|default:"no client" }}</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Create</button>
  <a class="btn" href="{% url 'sqb:job_list' %}">Cancel</a>
</form>
<p class="page-sub" style="margin-top:12px;">No SQB type yet? <a data-modal href="{% url 'sqb:type_manage' %}">Create one first</a>.</p>
{% endblock %}
