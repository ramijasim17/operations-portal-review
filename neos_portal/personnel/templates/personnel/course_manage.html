{% extends "core/base.html" %}
{% block content %}
<h1>Training courses</h1>
<table class="data-table">
  <tr><th>Course</th><th></th></tr>
  {% for c in courses %}
  <tr>
    <td>{{ c.course_name }}</td>
    <td>{% if user.profile.can_delete %}<form method="post" action="{% url 'personnel:course_delete' c.pk %}" style="display:inline;">{% csrf_token %}<button class="btn" type="submit" data-confirm="Delete this course?">Delete</button></form>{% endif %}</td>
  </tr>
  {% empty %}
  <tr><td colspan="2">No courses yet.</td></tr>
  {% endfor %}
</table>
<h2>New course</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Create</button>
</form>
<a class="btn" href="{% url 'personnel:list' %}" style="margin-top:12px; display:inline-block;">Back</a>
{% endblock %}
