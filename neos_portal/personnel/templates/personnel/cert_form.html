{% extends "core/base.html" %}
{% block content %}
<h1>{% if cert %}Edit{% else %}New{% endif %} certificate</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn" href="{% url 'personnel:cert_matrix' %}">Cancel</a>
</form>
{% endblock %}
