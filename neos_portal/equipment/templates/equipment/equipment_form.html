{% extends "core/base.html" %}
{% block content %}
<h1>Add Equipment</h1>
<form method="post">
  {% csrf_token %}
  <label>Serial Number</label>{{ form.serial_number }}
  <label>Category</label>{{ form.category }}
  <label>Description</label>{{ form.description }}
  <label>Location</label>{{ form.location }}
  <br><br>
  <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
