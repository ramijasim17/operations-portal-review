{% extends "core/base.html" %}
{% block content %}
<h1>Delete drum "{{ drum.drum_number }}"?</h1>
<p class="page-sub">This deletes the drum, its entire job log, and all evidence files. This can't be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-primary" type="submit">Yes, delete it</button>
  <a class="btn" href="{% url 'wire_management:list' %}">Cancel</a>
</form>
{% endblock %}
